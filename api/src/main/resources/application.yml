server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: worker-attendance-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${SPRING_DATASOURCE_USERNAME:attendance}
    password: ${SPRING_DATASOURCE_PASSWORD:attendance}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:test-google-client-id.apps.googleusercontent.com}
    jwt-secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==}
    jwt-access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    jwt-refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    com.attendance: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.attendance: INFO
    org.hibernate.SQL: OFF
